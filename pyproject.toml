# Config home for ruff, mypy, and coverage. Pytest config stays in pytest.ini.
# Pre-commit and CI may still pass equivalent CLI flags — they are now
# redundant with this file but harmless. Trim them as confidence grows.

[tool.ruff]
# MUST track the OLDEST Python we support, not the one CI runs. `hacs.json`
# promises Home Assistant >= 2025.1.0, which runs on Python 3.12. Pointing this
# at the CI interpreter (3.14) authorises ruff to rewrite code into syntax those
# users cannot parse, and then leaves it unflagged: that is how
# wiener-linien-austria v1.7.1 shipped PEP 758 unparenthesized `except A, B:`
# and failed to import below Python 3.14 (rolandzeiner/wiener-linien-austria#91).
# This repo carried the same rewrite, caught before it reached a release.
# Raise this only together with the `homeassistant` floor in `hacs.json`.
target-version = "py312"
line-length = 88

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["custom_components/tankstellen_austria"]

[tool.coverage.run]
source = ["custom_components/tankstellen_austria"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_empty = true
