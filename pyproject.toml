# Config home for ruff, mypy, and coverage. Pytest config stays in pytest.ini.
# Pre-commit and CI may still pass equivalent CLI flags — they are now
# redundant with this file but harmless. Trim them as confidence grows.

[tool.ruff]
# MUST track the OLDEST Python we support, not the one CI runs. `hacs.json`
# promises Home Assistant >= 2026.3.0, which runs on Python 3.14. Today that is
# also the CI interpreter, but the two only coincide: pointing this at the CI
# interpreter on its own authorises ruff to rewrite code into syntax those
# users cannot parse, and then leaves it unflagged: that is how
# wiener-linien-austria v1.7.1 shipped PEP 758 unparenthesized `except A, B:`
# and failed to import below Python 3.14 (rolandzeiner/wiener-linien-austria#91).
# This repo carried the same rewrite, caught before it reached a release.
# Raise this only together with the `homeassistant` floor in `hacs.json`.
target-version = "py314"
line-length = 88

# The portfolio's Python lint baseline (spanish-breakfast/references/
# python-baseline.md). ruff's defaults are E4, E7, E9 and F; everything
# that finds a bug in HA code is opt-in.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # ruff's default set, kept explicit
    "I",                    # isort
    "UP",                   # pyupgrade — safe ONLY while target-version is
                            # the support floor; see the note above it
    "B",                    # flake8-bugbear
    "C4",                   # flake8-comprehensions
    "RET",                  # flake8-return
    "PTH",                  # flake8-use-pathlib
    "SIM",                  # flake8-simplify
    "LOG", "G",             # logging correctness + logging-format
    "T20",                  # no stray print()
    "ASYNC",                # flake8-async
    "DTZ",                  # naive datetimes
    "TID",                  # tidy imports
    "ISC",                  # implicit str concat
    "PIE", "RSE", "FURB", "PERF",
    "BLE",                  # broad excepts, each a reasoned noqa
    "SLF",                  # private-member access across class boundaries
    "RUF",                  # ruff-specific, incl. RUF100 dead-noqa
]
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private members on purpose, and may block the test
# loop on purpose (reading files, polling a task).
"tests/*" = ["SLF", "ASYNC110", "ASYNC240"]
"scripts/*" = ["T201"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["custom_components/tankstellen_austria"]

# Home Assistant 2026.10 annotates its APIs with `probatio.Schema` and aliases
# `voluptuous` to probatio at runtime. mypy cannot see that alias, and the real
# voluptuous package is still installed (annotatedyaml and hass-nabucasa depend
# on it), so every `vol.Schema` handed to Home Assistant looked like an
# unrelated class. Skipping the import types `vol.*` as Any, which is what the
# alias amounts to. Importing probatio directly would need Home Assistant 2026.9.
[[tool.mypy.overrides]]
module = "voluptuous.*"
follow_imports = "skip"

[tool.coverage.run]
source = ["custom_components/tankstellen_austria"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_empty = true
